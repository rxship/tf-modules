trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  TF_VERSION: '1.9.5'
  WORKING_DIR: 'environments/dev'
  TFVARS_FILE: 'dev.tfvars'

stages:
  # =====================================================
  # STAGE 1: Init + Validate (runs on every branch push)
  # =====================================================
  - stage: Validate
    displayName: 'Terraform Init & Validate'
    jobs:
      - job: ValidateJob
        displayName: 'Init and Validate'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKING_DIR)'
              backendServiceArm: 'azure-spn-connec'
              backendAzureRmResourceGroupName: 'rg-tfstate-dev'
              backendAzureRmStorageAccountName: 'tfstatedevrjp'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKING_DIR)'

  # =====================================================
  # STAGE 2: Plan (depends on Validate, shows what would change)
  # =====================================================
  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PlanJob
        displayName: 'Terraform Plan'
        steps:
          # Re-install Terraform — each stage runs on a fresh agent.
          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          # Re-init — same reason. Fresh agent has no .terraform folder.
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKING_DIR)'
              backendServiceArm: 'azure-spn-connec'
              backendAzureRmResourceGroupName: 'rg-tfstate-dev'
              backendAzureRmStorageAccountName: 'tfstatedevrjp'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/$(WORKING_DIR)'
              environmentServiceNameAzureRM: 'azure-spn-connec'
              commandOptions: '-var-file=$(TFVARS_FILE)'